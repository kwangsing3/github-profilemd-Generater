name: GitHub-readme-profile
description: Generate profile summary cards (languages, topics, overview) and commit them to the repository
author: kwangsing3

inputs:
  USERNAME:
    required: true
    description: 'GitHub username'
    default: ${{ github.repository_owner }}
  GITHUB_REPO_NAME:
    required: true
    description: 'repo name'
    default: ${{ github.event.repository.name }}
  THEME:
    required: false
    description: 'Comma separated theme keys, or "all" to render every theme'
    default: 'all'
  TOP_N:
    required: false
    description: 'Number of languages / topics to display per card'
    default: '8'
  HIDE:
    required: false
    description: 'Comma separated languages to exclude (e.g. "HTML,CSS")'
    default: ''
  OUTPUT_DIR:
    required: false
    description: 'Directory the generated cards are written to'
    default: 'output'

runs:
  using: 'node24'
  main: 'dist/index.js'

branding:
  icon: 'activity'
  color: 'orange'
